name: Columbus Crew Post-Match xG Run

on:
  schedule:
    # Runs at 04:00 UTC (midnight EDT) on Sunday, Monday, and Thursday mornings
    - cron: '0 4 * * 0,1,4'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push updated JSON/CSV/plots back to repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute post-match processing
        run: |
          python update_season.py

      - name: Commit and push updated match data and plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ dashboard/ data/
          git diff --staged --quiet || (git commit -m "Auto-update 2026 Crew match xG data [skip ci]" && git push)